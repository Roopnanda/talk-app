name: talk_app
description: Anonymous voice-chat language practice app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State/storage
  shared_preferences: ^2.2.3

  # Backend
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5

  # Calling
  flutter_webrtc: ^0.10.2

  # Monetization
  google_mobile_ads: ^5.1.0

  # Dictionary lookups + typography
  http: ^1.2.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
