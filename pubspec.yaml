name: talk_app
description: Anonymous voice-chat language practice app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State/storage
  shared_preferences: any

  # Backend
  firebase_core: any
  # firebase_auth 6.6.0 has a confirmed Kotlin compile-time bug (a
  # Checker Framework annotation class becomes "inaccessible" during
  # :firebase_auth:compileDebugKotlin — a regression in that specific
  # release, not something in our code). Excluding it specifically
  # rather than guessing a replacement version number.
  firebase_auth: '<6.6.0'
  cloud_firestore: any

  # Calling
  flutter_webrtc: any

  # Monetization
  google_mobile_ads: any

  # Dictionary lookups + typography
  http: any
  google_fonts: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
