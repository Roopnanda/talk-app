name: talk_app
description: Anonymous voice-chat language practice app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State/storage
  shared_preferences: any

  # Backend — left fully unconstrained; a manually-pinned version set
  # built successfully once but still crashed at runtime with a
  # Dart/native mismatch, so letting pub freely resolve the whole graph
  # is what actually worked.
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any

  # Calling
  flutter_webrtc: any
  flutter_foreground_task: any

  # Monetization
  google_mobile_ads: any

  # Dictionary lookups + typography
  http: any
  google_fonts: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
