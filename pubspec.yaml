name: talk_app
description: Anonymous voice-chat language practice app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State/storage
  shared_preferences: any

  # Backend — pinned to FlutterFire's own verified-compatible release set
  # (BoM 4.15.0), not independently "any"/ranged. Mixing versions across
  # these three plugins loosely is what caused the last two build
  # failures (a broken 6.6.0 firebase_auth, then a firebase_auth/
  # firebase_core pairing that doesn't actually exist together).
  firebase_core: 4.10.0
  firebase_auth: 6.5.2
  cloud_firestore: 6.5.0

  # Calling
  flutter_webrtc: any

  # Monetization
  google_mobile_ads: any

  # Dictionary lookups + typography
  http: any
  google_fonts: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
